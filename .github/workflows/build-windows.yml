name: Build Dadway VPN Windows v2.0
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DadwayVPN.Windows.sln
      - name: Build
        run: dotnet build DadwayVPN.Windows.sln -c Release --no-restore
      - name: Publish portable
        run: dotnet publish src/DadwayVPN.Windows/DadwayVPN.Windows.csproj -c Release -r win-x64 --self-contained true -o artifacts/portable
      - name: Archive portable
        shell: pwsh
        run: Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/DadwayVPN-Windows-v2.0.0-Portable.zip
      - name: Build MSI
        run: dotnet build installer/DadwayVPN.Installer.wixproj -c Release -p:PublishDir=${{ github.workspace }}\artifacts\portable\
      - name: Collect MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem installer -Recurse -Filter *.msi | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName artifacts/DadwayVPN-Windows-v2.0.0.msi }
      - uses: actions/upload-artifact@v4
        with:
          name: DadwayVPN-Windows-v2.0.0
          path: |
            artifacts/DadwayVPN-Windows-v2.0.0-Portable.zip
            artifacts/DadwayVPN-Windows-v2.0.0.msi
          if-no-files-found: error
