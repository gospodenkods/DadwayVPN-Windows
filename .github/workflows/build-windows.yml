name: Build Dadway VPN for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate sources
        run: pnpm run check

      - name: Download Xray Core
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/XTLS/Xray-core/releases/latest
          $asset = $release.assets | Where-Object name -eq 'Xray-windows-64.zip' | Select-Object -First 1
          if (-not $asset) { throw 'Xray-windows-64.zip not found' }
          Invoke-WebRequest $asset.browser_download_url -OutFile xray.zip
          New-Item runtime -ItemType Directory -Force | Out-Null
          Expand-Archive xray.zip runtime -Force

      - name: Build installer
        run: pnpm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DadwayVPN-Windows-${{ github.sha }}
          path: |
            release/DadwayVPN-Windows-*.exe
            release/DadwayVPN-Windows-*.exe.blockmap
          if-no-files-found: error
